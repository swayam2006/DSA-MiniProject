<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Lot System</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f7f9fc;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      width: 400px;
      padding: 30px 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      border-radius: 16px;
      text-align: center;
    }

    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .option {
      background: #f1f4f9;
      color: #333;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .option:hover {
      background: #0077ff;
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 119, 255, 0.2);
    }

    footer {
      font-size: 12px;
      color: #aaa;
      margin-top: 15px;
    }

    /* MODAL POPUP STYLING */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      width: 350px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .modal-content h2 {
      margin-bottom: 15px;
      font-size: 20px;
      color: #0077ff;
    }

    .modal-content input, select {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .modal-content button {
      background: #0077ff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .modal-content button:hover {
      background: #005fd4;
    }

    .close {
      float: right;
      cursor: pointer;
      font-size: 20px;
      color: #aaa;
    }

    .close:hover {
      color: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Parking Lot System</h1>
    <div class="option" onclick="openModal('park')">🚗 Park Vehicle</div>
    <div class="option" onclick="openModal('book')">📅 Pre-Book Slot</div>
    <div class="option" onclick="openModal('status')">📋 Display Parking Status</div>
    <div class="option" onclick="openModal('exit')">🚙 Exit Vehicle</div>
    <div class="option" onclick="openModal('search')">🔍 Search Vehicle</div>
    <div class="option" onclick="openModal('admin')">📊 Admin Summary</div>
    <footer>© 2025 SmartPark | Minimal UI</footer>
  </div>

  <!-- MODALS -->
  <div id="modal" class="modal">
    <div class="modal-content" id="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');

    function openModal(type) {
      modal.style.display = 'flex';
      if (type === 'park') {
        modalTitle.innerText = "🚗 Park Vehicle";
        modalBody.innerHTML = `
          <input type="text" placeholder="Owner Name">
          <input type="text" placeholder="Vehicle Number">
          <select>
            <option>Car</option>
            <option>Bike</option>
            <option>Scotty</option>
          </select>
          <button>Submit</button>
        `;
      } else if (type === 'book') {
        modalTitle.innerText = "📅 Pre-Book Slot";
        modalBody.innerHTML = `
          <input type="text" placeholder="Owner Name">
          <input type="text" placeholder="Vehicle Number">
          <input type="date">
          <button>Book Slot</button>
        `;
      } else if (type === 'status') {
        modalTitle.innerText = "📋 Parking Status";
        modalBody.innerHTML = "<p>Displaying current slots... (Connect to C backend later)</p>";
      } else if (type === 'exit') {
        modalTitle.innerText = "🚙 Exit Vehicle";
        modalBody.innerHTML = `
          <input type="text" placeholder="Enter Vehicle Number">
          <button>Exit & Generate Receipt</button>
        `;
      } else if (type === 'search') {
        modalTitle.innerText = "🔍 Search Vehicle";
        modalBody.innerHTML = `
          <input type="text" placeholder="Enter Vehicle Number">
          <button>Search</button>
        `;
      } else if (type === 'admin') {
        modalTitle.innerText = "📊 Admin Summary";
        modalBody.innerHTML = "<p>End-of-day summary here...</p>";
      }
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }
  </script>
</body>
</html>
